<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ironmax">
<meta name="theme-color" content="#0D1014">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Ironmax</title>
<style>
:root{
  --bg:#0D1014;--card:#161A20;--card2:#1E232B;--line:#2A303A;--txt:#EEF1F5;--mut:#8A93A1;
  --acc:#E4002B;--accd:#8A1A24;--far:#4A5260;--pain:#FFB020;--onacc:#FFFFFF;
  --r:20px;--disp:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  --sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 -apple-system,system-ui,sans-serif;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 14px) 16px calc(var(--sab) + 96px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:-.5px;line-height:1}
.brand i{font-style:normal;color:var(--acc)}
.sub{color:var(--mut);font-size:13px;margin-top:4px}
.sync{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:99px}
.sync b{width:7px;height:7px;border-radius:9px;background:var(--mut);display:inline-block}
.sync.on b{background:var(--acc)}
h2{font-family:var(--disp);font-weight:800;font-size:22px;margin:22px 0 10px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);padding:8px;border-radius:var(--r)}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:14px;color:var(--mut);font-family:var(--disp);font-weight:700;font-size:13px}
.cat svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cat.on{background:var(--txt);color:var(--bg)}
.cat.on svg{stroke:var(--bg)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px;margin-top:10px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--txt);box-shadow:inset 0 0 0 1px var(--line)}
.seg button.on.acc{background:var(--acc);color:var(--onacc);box-shadow:none}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-top:12px}
.card h3{font-family:var(--disp);font-weight:800;font-size:21px;margin:0 0 4px}
.muted{color:var(--mut)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card2);color:var(--mut)}
.tag.pain{color:var(--pain);background:rgba(255,176,32,.12)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:15px;border-radius:16px;background:var(--acc);color:var(--onacc);font-family:var(--disp);font-weight:800;font-size:17px}
.go.done{background:var(--txt);color:#111}
.go svg{width:18px;height:18px;fill:currentColor}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ex{background:var(--card2);border-radius:18px;padding:12px;text-align:left;position:relative;display:flex;flex-direction:column}
.ex .num{color:var(--acc);font-family:var(--disp);font-weight:700;font-size:15px}
.ex .t{position:absolute;top:10px;right:10px;font-size:12px;background:var(--bg);padding:3px 8px;border-radius:99px;color:var(--mut);font-variant-numeric:tabular-nums}
.ex .nm{font-family:var(--disp);font-weight:700;font-size:15px;line-height:1.2;margin-top:4px}
.ex .zn{font-size:12px;color:var(--mut);margin-top:2px}
.fig{width:100%;height:auto;display:block}
.fig .s{stroke:var(--txt);stroke-width:4.4;stroke-linecap:round;fill:none}
.fig .s.far{stroke:var(--far)}
.fig .s.hl{stroke:var(--acc)}
.fig .s.far.hl{stroke:var(--accd)}
.fig .hd{fill:var(--txt)}
.fig .gr{stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 4}
.fig .wl{stroke:var(--line);stroke-width:2.5}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,16,20,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 10px calc(var(--sab) + 8px);display:flex;justify-content:center}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);padding:4px 0}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--acc)}
/* body map */
.bodywrap{display:flex;gap:6px;justify-content:center}
.body{width:46%;max-width:210px}
.body .z{fill:#2A313B;stroke:var(--bg);stroke-width:2;transition:fill .15s}
.body .z.sel{fill:var(--acc)}
.body .z.pain{fill:var(--pain)}
.body .nz{fill:#20262E}
.body text{fill:var(--mut);font-size:13px;text-anchor:middle;font-family:-apple-system,system-ui}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{padding:8px 12px;border-radius:99px;background:var(--card2);font-size:13px;font-weight:600;color:var(--mut)}
.chip.sel{background:var(--acc);color:var(--onacc)}
.chip.pain{background:var(--pain);color:#111}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
.row{display:flex;gap:10px}
.stat{flex:1;background:var(--card);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--disp);font-weight:800;font-size:26px}
.stat span{font-size:12px;color:var(--mut)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.heat div{aspect-ratio:1;border-radius:7px;background:var(--card2)}
.heat div.l1{background:#6E1820}.heat div.l2{background:var(--acc)}
.heat div.today{box-shadow:inset 0 0 0 2px var(--txt)}
.heat .dn{background:none;font-size:11px;color:var(--mut);text-align:center;aspect-ratio:auto}
.hist{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}
.hist .d{width:44px;text-align:center;font-family:var(--disp);font-weight:800;font-size:18px;line-height:1}
.hist .d small{display:block;font-size:11px;color:var(--mut);font-weight:600;margin-top:2px}
.hist .m{flex:1;min-width:0}
.hist .m b{display:block;font-weight:600}
.hist .x{color:var(--mut);padding:8px;font-size:18px}
.btn{padding:12px 14px;border-radius:12px;background:var(--card2);font-weight:600;font-size:14px}
.btn.red{color:var(--pain)}
.set{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.set:last-child{border:0}
.tg{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:99px;background:var(--txt);transition:.2s}
.tg.on{background:var(--acc)}.tg.on::after{left:23px;background:#fff}
textarea{width:100%;min-height:90px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px ui-monospace,monospace;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--sab) + 92px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--txt);color:#111;padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 20px calc(var(--sab) + 20px);max-height:88vh;overflow:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.cues{margin:12px 0 0;padding:0;list-style:none;counter-reset:c}
.cues li{counter-increment:c;padding:8px 0 8px 32px;position:relative;border-top:1px solid var(--line)}
.cues li::before{content:counter(c);position:absolute;left:0;top:8px;width:22px;height:22px;border-radius:99px;background:var(--card2);color:var(--acc);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
/* player */
.player{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;flex-direction:column;padding:calc(var(--sat) + 12px) 20px calc(var(--sab) + 18px)}
.player.show{display:flex}
.ptop{display:flex;justify-content:space-between;align-items:center}
.pbar{display:flex;gap:3px;margin:12px 0 4px}
.pbar i{flex:1;height:4px;border-radius:9px;background:var(--line)}
.pbar i.d{background:var(--acc)}.pbar i.c{background:var(--txt)}
.pstage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0}
.pfig{width:100%;max-width:380px}
.pfig.breath{animation:br 4s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.025)}}
.plabel{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--acc);font-weight:700}
.pname{font-family:var(--disp);font-weight:800;font-size:26px;text-align:center;margin-top:6px;line-height:1.15}
.pcue{color:var(--mut);text-align:center;margin-top:6px;min-height:42px;font-size:15px}
.ring{position:relative;width:150px;height:150px;margin:8px auto 0}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:46px;font-variant-numeric:tabular-nums}
.pctl{display:flex;justify-content:center;align-items:center;gap:26px;margin-top:14px}
.pctl button{width:56px;height:56px;border-radius:99px;background:var(--card);display:flex;align-items:center;justify-content:center}
.pctl button.main{width:76px;height:76px;background:var(--acc);color:var(--onacc)}
.pctl svg{width:24px;height:24px;fill:currentColor}
.prep .pname{color:var(--mut)}
.end{text-align:center}
.end .big{font-family:var(--disp);font-weight:800;font-size:56px;color:var(--acc);line-height:1}
.x-btn{width:38px;height:38px;border-radius:99px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px}
.empty{color:var(--mut);text-align:center;padding:20px 0}
.inp{width:96px;text-align:right;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font:600 16px -apple-system,system-ui;padding:8px 10px}
.inp.wide{width:100%;text-align:left;margin-top:10px;font-weight:400}
.ls{padding:10px 0;border-top:1px solid var(--line)}.ls:first-of-type{border:0}.lh{display:flex;justify-content:space-between;gap:8px;font-size:14px}.lc{margin-top:6px;font-size:13.5px;padding:8px 10px;border-left:3px solid var(--acc);background:rgba(228,0,43,.07);border-radius:0 10px 10px 0}
.wnav{display:flex;align-items:center;gap:10px}.wnav>div{flex:1;text-align:center}.wnav b{font-family:var(--disp);font-size:20px;display:block}.wnav small{color:var(--mut);font-size:12px}
.wnav button{width:40px;height:40px;border-radius:99px;background:var(--card2);font-size:22px;line-height:1}
.wnote{margin-top:10px;font-size:13px;color:var(--mut)}.wnote b{color:var(--acc)}
.day{padding:10px 0;border-top:1px solid var(--line);scroll-margin-top:calc(var(--sat) + 10px)}.day:first-child{border:0}
.day.past{opacity:.55}.day.today{opacity:1}.day.today .dh b{color:var(--acc)}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.dh b{font-family:var(--disp);font-size:16px}
.rest{font-size:13px;color:var(--mut);padding:4px 0}
.sx{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:12px;background:var(--card2);margin-top:6px}
.sx.open{background:#262C36}.sx .slot{font-size:10.5px;font-weight:700;color:var(--mut);width:36px;text-transform:uppercase;letter-spacing:.3px}
.sx .ic{font-size:18px}.sx .ti{flex:1;min-width:0}.sx .ti b{display:block;font-size:14px}.sx .ti small{color:var(--mut);font-size:12px}
.sx .chev{color:var(--mut);font-size:18px}.sx{cursor:pointer}
.sx .more{padding:4px 8px;margin:-4px -6px -4px 0;color:var(--mut);font-size:20px;line-height:1;border-radius:8px}
.sx.miss{box-shadow:inset 3px 0 0 #F5A524}.tag2{font-style:normal;font-size:10px;font-weight:700;color:var(--mut);background:var(--bg);padding:2px 6px;border-radius:6px;margin-left:4px;vertical-align:2px}
.addb{display:block;width:100%;text-align:left;font-size:12px;color:var(--mut);padding:8px 10px 2px}
.dlb{font-family:-apple-system,system-ui;font-size:11px;font-weight:700;background:rgba(78,168,255,.18);color:#4EA8FF;padding:3px 8px;border-radius:99px;vertical-align:4px}
.sel{flex:1;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:14px}.sx .ok{color:#3DDC84;font-weight:800}
.sdet{padding:8px 10px 4px 56px}.srow{display:flex;gap:10px;padding:4px 0;font-size:13px;border-bottom:1px dashed var(--line)}.srow:last-child{border:0}
.srow span{color:var(--mut);width:86px;flex:0 0 auto}.srow b{font-weight:600}
.rt{width:100%;margin-top:6px;border-collapse:collapse;font-size:12px}.rt th{text-align:left;color:var(--mut);font-weight:600;padding:2px 4px}.rt td{padding:2px 4px;border-top:1px solid var(--line)}.cm.w{border-left-color:#F5A524;background:rgba(245,165,36,.07)}
.cm{margin:6px 0 0 56px;padding:8px 10px;border-left:3px solid #3DDC84;background:rgba(61,220,132,.07);border-radius:0 10px 10px 0;font-size:13px}
.bk{margin-top:8px}.bk>span{font-family:var(--disp);font-weight:800;font-size:13px}.wchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.wc{font-size:11.5px;padding:5px 8px;border-radius:8px;background:var(--card2);color:var(--mut)}.wc.dl{opacity:.6}.wc.cur{box-shadow:inset 0 0 0 1.5px var(--txt);color:var(--txt);opacity:1}.wc.on{background:var(--acc);color:#fff;opacity:1}
.orow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.orow .ol{flex:1;min-width:0}
.orow select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:13px}
.wk{display:flex;width:100%;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);text-align:left;font-size:13.5px}
.wk .wn{font-family:var(--disp);font-weight:800;width:34px}.wk .wd{color:var(--mut);width:52px;font-size:12px}.wk .wt{flex:1;color:var(--mut);font-size:12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.wk .wh{font-family:var(--disp);font-weight:700}
.wk .tt{color:var(--acc);font-weight:700}
.wk.past{opacity:.45}.wk.cur{background:rgba(228,0,43,.12);border-radius:10px;padding-left:8px;padding-right:8px;opacity:1}
.wdet{padding:2px 0 10px 42px}.dsplit{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);margin-bottom:6px}
.ses{display:flex;gap:8px;align-items:baseline;padding:4px 0;font-size:13.5px}.ses .sl{flex:1}.ses b{font-family:var(--disp);white-space:nowrap}
.hero{background:linear-gradient(135deg,rgba(228,0,43,.22),rgba(228,0,43,.04));border:1px solid rgba(228,0,43,.3);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}.hero .hh{font-family:var(--disp);font-weight:800;font-size:20px;margin-bottom:6px}.hero .hl{font-size:14px;margin-top:3px}.hero .hq{font-size:12px;color:var(--mut);margin-top:10px;font-style:italic}
.dc{background:var(--card);border-radius:var(--r);padding:18px;margin-top:12px}
.dl{font-size:13px;color:var(--mut);font-weight:600}
.dl small{display:block;font-weight:400;font-size:11.5px;margin-top:1px}
.big{font-family:var(--disp);font-weight:800;font-size:52px;line-height:1;margin:6px 0 10px}
.big small{font-size:18px;color:var(--mut);font-weight:700;margin-left:4px}
.bar{margin-top:10px}.bar .h{display:flex;justify-content:space-between;font-size:14px;font-weight:600}.bar .h b{font-family:var(--disp);font-size:18px}
.trk{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin:5px 0 3px}.trk i{display:block;height:100%;border-radius:9px}
.bar .f{font-size:12px;color:var(--mut)}
.gauge{position:relative;display:flex;height:10px;border-radius:9px;overflow:hidden;margin:4px 0 4px}
.gauge span{height:100%}.gauge b{position:absolute;top:-4px;width:5px;height:18px;margin-left:-2.5px;background:var(--txt);border-radius:3px;box-shadow:0 0 0 2px var(--card)}
.gsc{display:flex;font-size:10.5px;color:var(--mut)}
.facts{list-style:none;padding:0;margin:12px 0 0;font-size:13.5px}.facts li{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}.facts li span{color:var(--mut)}
.msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--card);margin-top:8px;font-size:14px}
.msg i{font-style:normal;flex:0 0 auto;width:24px;height:24px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.msg.alert i{background:var(--acc);color:#fff}.msg.warn i{background:#F5A524;color:#111}.msg.info i{background:var(--card2);color:var(--txt)}
.splits{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.splits div{flex:1;text-align:center;padding:8px 2px;border-right:1px solid var(--line)}.splits div:last-child{border:0;background:rgba(228,0,43,.14)}
.splits span{display:block;font-size:10.5px;color:var(--mut)}.splits b{font-family:var(--disp);font-size:15px}
.splits div:last-child b{color:var(--acc)}
.chart{width:100%;display:block;margin-top:10px}
.chart text{fill:var(--mut);font-size:10px;font-family:-apple-system,system-ui}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.tile{background:var(--card);border-radius:16px;padding:12px}.tile span{font-size:11.5px;color:var(--mut)}.tile b{display:block;font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.1;margin-top:4px}.tile b small{font-size:12px;color:var(--mut);margin-left:2px}.tile em{font-style:normal;font-size:11px;color:var(--mut)}
.vp{padding:10px 0;border-top:1px solid var(--line)}.vp:first-of-type{border:0}
.vp .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:600;font-size:14px}
.vp .x{font-size:12.5px;color:var(--mut);margin-top:2px}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.st.up{background:rgba(61,220,132,.15);color:#3DDC84}.st.ok{background:rgba(78,168,255,.16);color:#4EA8FF}.st.warn{background:rgba(245,165,36,.18);color:#F5A524}
.src{font-size:11.5px;color:var(--mut);text-align:center;margin-top:16px}
.intro{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;transition:opacity .5s}
.intro.out{opacity:0;pointer-events:none}
.intro svg{width:100%;max-width:560px}

let DB=null;
const sync={on:false};
function initDB(){
  if(!(window.claude&&typeof window.claude.use==="function"))return false;
  window.claude.use("db").then(db=>{
    if(!db)return;DB=db;
    let first=true;
    db.collection("sessions").orderBy("ts","desc").limit(1000).onSnapshot(snap=>{
      const remote=snap.docs.map(d=>d.data());
      const ids=new Set(remote.map(r=>r.id));
      const localOnly=S.sessions.filter(s=>!ids.has(s.id));
      if(first&&!snap.metadata.fromCache){first=false;localOnly.forEach(s=>db.collection("sessions").doc(s.id).set(s).catch(()=>{}))}
      S.sessions=remote.concat(localOnly).sort((a,b)=>b.ts-a.ts);
      sync.on=true;saveLocal();render();
    },()=>{sync.on=false;render()});
    db.doc("settings/main").onSnapshot(d=>{
      if(d.exists){const v=d.data();if(Array.isArray(v.pain))S.pain=v.pain.slice();if(v.prefs)Object.assign(S.prefs,v.prefs);saveLocal();render()}
      else pushSettings();
    },()=>{});
  }).catch(()=>{});
  return true;
}

/* ============ FIGURE ============ */
function lerp(a,b,t){const r={};for(const k in a){if(Array.isArray(a[k])&&Array.isArray(b[k]))r[k]=[a[k][0]+(b[k][0]-a[k][0])*t,a[k][1]+(b[k][1]-a[k][1])*t];else r[k]=t<.5?a[k]:b[k]}
  if(a.s||b.s){const sa=a.s||mid(a.p,a.n),sb=b.s||mid(b.p,b.n);r.s=[sa[0]+(sb[0]-sa[0])*t,sa[1]+(sb[1]-sa[1])*t]}return r}
const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];
function figInner(q,hl,ng){
  hl=hl||[];const L=(a,b,k,far)=>`<line class="s${far?" far":""}${hl.includes(k)?" hl":""}" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}"/>`;
  const far=!q.front;const s=q.s||mid(q.p,q.n);
  const dx=q.h[0]-q.n[0],dy=q.h[1]-q.n[1];const nk=[q.n[0]+dx*.4,q.n[1]+dy*.4];
  let o=ng?"":`<line class="gr" x1="2" y1="89.5" x2="118" y2="89.5"/>`;
  if(q.wall)o+=`<line class="wl" x1="${q.wall}" y1="0" x2="${q.wall}" y2="89"/>`;
  o+=L(q.n,q.e2,"arm2",far)+L(q.e2,q.w2,"fore2",far)+L(q.p,q.k2,"thigh2",far)+L(q.k2,q.f2,"shin2",far);
  o+=`<path class="s${hl.includes("torso")?" hl":""}" d="M${q.p[0].toFixed(1)} ${q.p[1].toFixed(1)}Q${s[0].toFixed(1)} ${s[1].toFixed(1)} ${q.n[0].toFixed(1)} ${q.n[1].toFixed(1)}"/>`;
  o+=L(q.n,nk,"neck")+`<circle class="hd" cx="${q.h[0].toFixed(1)}" cy="${q.h[1].toFixed(1)}" r="6.6"/>`;
  if(hl.includes("neck"))o+=`<circle cx="${q.h[0].toFixed(1)}" cy="${q.h[1].toFixed(1)}" r="9.5" fill="none" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="2 3"/>`;
  o+=L(q.p,q.k1,"thigh1")+L(q.k1,q.f1,"shin1")+L(q.n,q.e1,"arm1")+L(q.e1,q.w1,"fore1");
  return o;
}
const fig=(e,cls)=>`<svg class="fig ${cls||""}" viewBox="0 -6 120 100">${figInner(P[e.a[0]],e.hl)}</svg>`;
function poseAt(e,t){const a=e.a;if(a.length<2)return P[a[0]];const per=1.3;const u=(t/per)%a.length;const i=Math.floor(u);let f=u-i;f=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2;return lerp(P[a[i]],P[a[(i+1)%a.length]],f)}
const anims=new Set();
function rafLoop(ts){anims.forEach(o=>{if(!document.body.contains(o.el)){anims.delete(o);return}o.el.innerHTML=figInner(poseAt(o.e,ts/1000),o.e.hl)});if(anims.size)requestAnimationFrame(rafLoop)}
function animate(el,e){anims.forEach(o=>{if(o.el===el)anims.delete(o)});if(e.a.length<2){el.innerHTML=figInner(P[e.a[0]],e.hl);return}const was=anims.size;anims.add({el,e});if(!was)requestAnimationFrame(rafLoop)}

/* ============ SESSION BUILDERS ============ */
function catSession(){
  const c=CATS.find(c=>c.id===UI.cat);const ids=c[UI.mode];
  const all=ids.map(i=>EXM[i]);const list=all.filter(e=>!blocked(e));
  return {key:c.id+":"+UI.mode,title:c.n+" · "+(UI.mode==="pre"?"Activation":"Récup"),desc:UI.mode==="pre"?c.dPre:c.dPost,list,removed:all.length-list.length,cat:c.id,mode:UI.mode};
}
function genSession(){
  const zones=UI.sel.slice();if(!zones.length)return null;
  const target=UI.gMin*60;const mode=UI.gMode;
  const pool=EX.filter(e=>!blocked(e)&&e.z.some(z=>zones.includes(z)));
  const score=e=>e.z.filter(z=>zones.includes(z)).length*2+(mode==="mix"?0:((mode==="pre")===(e.t==="d")?3:0));
  pool.sort((a,b)=>score(b)-score(a));
  const out=[];let t=0;
  // 1) cover each zone at least once
  zones.forEach(z=>{const e=pool.find(e=>e.z.includes(z)&&!out.includes(e));if(e&&t<target){out.push(e);t=totalSec(out)}});
  // 2) fill
  for(const e of pool){if(t>=target-20)break;if(!out.includes(e)){out.push(e);t=totalSec(out)}}
  if(mode==="pre")out.sort((a,b)=>(a.t==="d"?0:1)-(b.t==="d"?0:1));
  if(mode==="post")out.sort((a,b)=>(a.t==="s"?1:0)-(b.t==="s"?1:0));
  const painOnly=EX.filter(e=>blocked(e)&&e.z.some(z=>zones.includes(z))).length;
  return {key:"corps",title:"Séance sur mesure",desc:zones.map(z=>Z[z]).join(" · "),list:out,removed:painOnly,cat:"corps",mode};
}

function stats(){
  const done=S.sessions.filter(s=>s.complete||s.done>=60);
  const days=new Set(done.map(s=>s.date));
  let streak=0;const d=new Date();if(!days.has(dkey(d)))d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){streak++;d.setDate(d.getDate()-1)}
  const now=new Date();const mon=new Date(now);mon.setHours(0,0,0,0);mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const week=done.filter(s=>s.ts>=mon.getTime()).reduce((a,s)=>a+s.done,0);
  return {streak,week:Math.round(week/60),n:done.length,days,mon};
}

let PL=null;
function startSession(se){
  if(!se||!se.list.length)return;
  audioInit();wakeOn();
  const steps=[];
  se.list.forEach((e,i)=>{const sides=e.s?2:1;for(let sd=1;sd<=sides;sd++){steps.push({k:"prep",secs:i===0&&sd===1?5:(sd===2?5:5),e,sd,sides,i});steps.push({k:"work",secs:exDur(e),e,sd,sides,i})}});
  PL={se,steps,idx:0,left:steps[0].secs,paused:false,last:performance.now(),worked:0,started:Date.now(),ended:false};
  $("#player").classList.add("show");closeSheet();
  enterStep();drawPlayer(true);
  PL.timer=setInterval(tick,100);
}
function enterStep(){
  const st=PL.steps[PL.idx];PL.left=st.secs;PL.lastBeep=null;
  if(st.k==="prep"){say(st.sd===2?"Change de côté":(PL.idx===0?"C'est parti. ":"Ensuite : ")+st.e.n)}
  else{beep(990,.25)}
}
function tick(){
  if(!PL||PL.paused||PL.ended)return;
  const now=performance.now();const dt=(now-PL.last)/1000;PL.last=now;
  PL.left-=dt;const st=PL.steps[PL.idx];if(st.k==="work")PL.worked+=dt;
  const sec=Math.ceil(PL.left);
  if(sec<=3&&sec>=1&&PL.lastBeep!==sec){PL.lastBeep=sec;beep(660,.12)}
  if(PL.left<=0){next();return}
  drawRing();
}
function next(){if(PL.idx>=PL.steps.length-1){finish(true);return}PL.idx++;enterStep();drawPlayer(true)}
function prev(){
  let i=PL.idx;const cur=PL.steps[i];
  // jump to start of current exercise, or previous one if already near start
  let j=i;while(j>0&&PL.steps[j-1].i===cur.i)j--;
  if(i===j||(cur.k==="prep"&&PL.left>cur.secs-1)){j=Math.max(0,j-1);while(j>0&&PL.steps[j-1].i===PL.steps[j].i)j--}
  PL.idx=j;enterStep();drawPlayer(true);
}
function finish(complete){
  if(!PL||PL.ended)return;PL.ended=true;clearInterval(PL.timer);wakeOff();
  const done=Math.round(PL.worked);const se=PL.se;
  if(done>=20){addSession({id:"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),ts:Date.now(),date:today(),key:se.key,title:se.title,cat:se.cat,mode:se.mode,zones:[...new Set(se.list.flatMap(e=>e.z))],exos:se.list.map(e=>e.id),n:se.list.length,done,planned:totalSec(se.list),complete:!!complete})}
  if(complete){beep(880,.15);setTimeout(()=>beep(1175,.3),180);say("Séance terminée. Bravo !")}
  $("#player").innerHTML=`<div class="ptop"><span></span><button class="x-btn" data-act="pclose">×</button></div><div class="pstage end"><div class="big">${complete?"Bravo":"Pause"}</div><div class="pname">${complete?"Séance terminée":"Séance interrompue"}</div><div class="pcue">${Math.round(done/60)} min de mobilité${done>=20?" · enregistrée dans ton suivi":""}</div>
  <button class="go" style="max-width:320px" data-act="pclose">Fermer</button></div>`;
}
function drawRing(){
  const st=PL.steps[PL.idx];const n=$("#pn");if(!n)return;

  const now=new Date(),hrs=now.getHours(),hello=hrs<12?"Bonjour":hrs<18?"Bon après-midi":"Bonsoir";
  const y=new Date(now);y.setDate(y.getDate()-1);const yk=dkey(y),tk=dkey(now);
  const lines=[];
  // séance d'hier
  const yd=["velo","course","nat","muscu"].map(s=>doneOn(yk,s)).flat();
  if(yd.length){const v=yd.find(x=>x.verdict)||yd[0];lines.push(v.verdict==="warn"?`Hier : ${v.title||"séance"} un peu difficile, on regarde ça de près.`:v.verdict==="up"?`Bonne séance hier, et avec de la marge 💪`:`Bonne séance hier${v.title?" ("+v.title+")":""} ✅`)}
  // programme du jour
  let todayS=[];try{const w=PLAN&&PLAN.weeks.find(x=>{const e=new Date(x.start+"T00:00:00");e.setDate(e.getDate()+7);return x.start<=tk&&dkey(e)>tk});if(w)todayS=weekSessions(w).filter(s=>s.date===tk&&!s.p.cancel)}catch(e){}
  const todayDone=["velo","course","nat","muscu"].some(s=>doneOn(tk,s).length);
  if(todayS.length&&!todayDone)lines.push("Aujourd'hui : "+todayS.map(s=>`${s.title}${mainTarget(s.k,s.p)?" ("+mainTarget(s.k,s.p)+")":""}`).join(" + ")+".");
  else if(todayDone)lines.push("Séance du jour faite, place à la récup 😌");
  else lines.push("Pas de séance prévue aujourd'hui : repos ou mobilité.");
  // actualité
  const f=D.fatigue.v;
  if(f>=60)lines.push("Fatigue très élevée : écoute ton corps, on allège.");
  else if(f<20&&!todayDone&&todayS.some(s=>s.p.sets||s.p.test))lines.push("Tu es frais : feu vert pour la qualité.");
  const nt=D.physio&&D.physio.nextTest;if(nt){const n=daysTo(nt.d);if(n>0&&n<=14)lines.push(`${nt.n} dans ${n} jour${n>1?"s":""}.`)}
  const q=QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length];
  return `<div class="hero"><div class="hh">${hello} Maxime 👋</div>${lines.map(l=>`<div class="hl">${esc(l)}</div>`).join("")}<div class="hq">« ${esc(q)} » · J-${daysTo("2027-06-27")}</div></div>`;
}

const FIELDS="id,start_date_local,type,name,description,source,device_name,elapsed_time,moving_time,distance,icu_weighted_avg_watts,average_watts,average_heartrate,max_heartrate,icu_training_load,decoupling,trainer,icu_rpe,icu_eftp";
async function apiGet(path){
  const r=await fetch("https://intervals.icu/api/v1/athlete/"+encodeURIComponent(CFG.athlete)+path,{headers:{Authorization:"Basic "+btoa("API_KEY:"+CFG.key)}});
  if(r.status===401||r.status===403)throw new Error("Clé ou identifiant refusé par Intervals.icu");
  if(!r.ok)throw new Error("Intervals.icu a répondu "+r.status);
  return r.json();
}
let ANA=lsGet("ironmax.ana",{});
function plannedFor(date,sport){
  if(!PLAN||!PLAN.blocks[0].tpl)return null;
  const w=PLAN.weeks.find(x=>{const e=new Date(x.start+"T00:00:00");e.setDate(e.getDate()+7);return x.start<=date&&dkey(e)>date});if(!w)return null;
  const c=weekSessions(w).filter(s=>s.date===date&&s.d===sport&&!s.p.cancel);if(!c.length)return null;
  const score=s=>(s.p.sets||s.p.tempo||s.p.blocks?2:0)+(s.p.test?3:0);c.sort((a,b)=>score(b)-score(a));return c[0];
}
function planTarget(s){
  if(!s||s.p.test)return null;const p=s.p,k=s.k,bike=s.d==="velo";
  let ps=IronAnalyze.parseSets(p.sets,p.rec);if(!ps&&p.tempo)ps=IronAnalyze.parseSets(p.tempo,"0'");
  if(!ps&&p.blocks)ps=IronAnalyze.parseSets(p.blocks,"5'");
  let target=null;
  if(bike){target=p.ou?Math.round((Wt(p.ou[0],k)+Wt(p.ou[1],k))/2):p.w?Wt(p.w,["long","brick","sim"].includes(k)?"long":k):null}
  else if(s.d==="course"){const v=p.v?(p.v+(k==="seuil"?(ADJ.seuil||0):0)):null;target=v?v*INP.vma/3.6:null}
  if(ps&&target)return Object.assign({sport:s.d,target},ps);
  if(bike||s.d==="course")return {sport:s.d,n:0,target:0};
  return null;
}
async function analyzeRecent(acts){
  const since=dkey(new Date(Date.now()-21*864e5));
  for(const a of acts){
    if(a.date<since||ANA[a.id])continue;
    if(a.sp==="nat"){const ps=plannedFor(a.date,"nat");if(!ps)continue;const feel=ps.p.light?"facile":({"1":"facile","2":"modere","3":"facile","4":"soutenu"})[ps.p.var]||(ps.k==="ow"?"modere":"modere");
      const r=IronAnalyze.analyzeSwim({m:ps.p.m,feel},{distance:a.distance,moving_time:a.moving_time,hr:a.average_heartrate,description:a.description},{fcmax:INP.fcmax,fcrest:INP.fcrest});
      ANA[a.id]={title:ps.title,comment:r.comment,verdict:r.verdict,sum:r.sum,sport:"nat",date:a.date};continue}
    if(!(a.sp==="velo"||a.sp==="course")||(a.moving_time||0)<1200)continue;
    const ps=plannedFor(a.date,a.sp),plan=planTarget(ps);if(!plan)continue;
    try{
      const raw=await apiGetAbs("https://intervals.icu/api/v1/activity/"+encodeURIComponent(a.id)+"/streams.json?types=time,watts,heartrate,velocity_smooth");
      const st={};(Array.isArray(raw)?raw:Object.keys(raw).map(k=>({type:k,data:raw[k]}))).forEach(x=>st[x.type]=x.data);
      if(!st.heartrate&&a.hrFrom){try{const r2=await apiGetAbs("https://intervals.icu/api/v1/activity/"+encodeURIComponent(a.hrFrom)+"/streams.json?types=time,heartrate");const s2={};(Array.isArray(r2)?r2:Object.keys(r2).map(k=>({type:k,data:r2[k]}))).forEach(x=>s2[x.type]=x.data);
        if(s2.heartrate&&s2.time){const off=a.hrOffset||0,tt=st.time||[];let j=0;st.heartrate=tt.map(t=>{const target=t+off;while(j<s2.time.length-1&&s2.time[j+1]<=target)j++;return s2.heartrate[j]})}}catch(e){}}
      if(!st.heartrate)continue;
      const res=IronAnalyze.analyze(plan,{time:st.time,hr:st.heartrate,watts:a.sp==="velo"?st.watts:null,speed:a.sp==="course"?st.velocity_smooth:null},{fcmax:INP.fcmax,fcrest:INP.fcrest});
      ANA[a.id]={title:ps.title,comment:res.comment,verdict:res.verdict,reps:res.reps.map(r=>[r.dur,Math.round(r.v*100)/100,Math.round(r.hr)]),recs:res.recs.map(r=>[r.dur,Math.round(r.drop60)]),sum:res.sum,sport:a.sp,date:a.date};
    }catch(e){}
  }
  const keys=Object.keys(ANA).sort((x,y)=>(ANA[x].date<ANA[y].date?1:-1));keys.slice(80).forEach(k=>delete ANA[k]);lsSet("ironmax.ana",ANA);
}
async function apiGetAbs(url){const r=await fetch(url,{headers:{Authorization:"Basic "+btoa("API_KEY:"+CFG.key)}});if(!r.ok)throw new Error(r.status);return r.json()}

/* ============ CALCULS (cf. doc de méthode) ============ */
const sportOfA=a=>/mobilit|physical\s*therap|physioth|kin[ée]|stretch|yoga|pilates/i.test((a.name||"")+" "+(a.type||""))?"mob":sportOf(a.type||"");
const sportOf=t=>/Ride|Cycl|Bike/i.test(t)?"velo":/Run/i.test(t)?"course":/Swim/i.test(t)?"nat":/Weight|Strength|Workout|Crossfit/i.test(t)?"muscu":/Yoga|Pilates|Stretch|Mobility/i.test(t)?"mob":"autre";
function actLoad(a){
  const h=(a.moving_time||0)/3600,sp=sportOf(a.type||"");if(!h)return 0;
  const R=INP.fcmax-INP.fcrest,lthr=INP.fcrest+.85*R;
  const wap=a.icu_weighted_avg_watts||a.average_watts;
  if(sp==="velo"&&wap)return h*Math.pow(wap/INP.ftp,2)*100;
  if(sp==="course"&&a.distance>500){const v=a.distance/a.moving_time,thr=INP.vma*.88/3.6;return h*Math.pow(v/thr,2)*100}
  if(sp==="nat"&&a.distance>100){const pace=a.moving_time/(a.distance/100),css=mmss(INP.css)||115;return h*Math.pow(css/pace,3)*100}
  if(sp==="muscu"||sp==="mob")return a.moving_time/60*(a.icu_rpe||(sp==="mob"?2:5))/6;
  if(a.average_heartrate)return h*Math.pow(Math.max(0,a.average_heartrate-INP.fcrest)/(lthr-INP.fcrest),2)*100;
  return a.icu_training_load||0;
}
/* Doublons vélo d'intérieur : une même séance arrive par Zwift (puissance) et par Polar (FC).
   Deux séances de vélo qui se chevauchent sur plus de la moitié de la plus courte = une seule séance.
   On garde celle qui a la puissance (Zwift en priorité), et on lui prête la FC de l'autre si besoin.
   Une séance Polar seule (ex. vélo Technogym en salle) est gardée telle quelle. */
const isZwift=a=>/zwift/i.test((a.source||"")+" "+(a.device_name||"")+" "+(a.name||""));
function dedupe(acts){
  const t0=a=>new Date(a.start_date_local).getTime()/1000,t1=a=>t0(a)+(a.elapsed_time||a.moving_time||0);
  const bikes=acts.filter(a=>a.sp==="velo").sort((a,b)=>t0(a)-t0(b)),drop=new Set();
  for(let i=0;i<bikes.length;i++)for(let j=i+1;j<bikes.length;j++){
    const a=bikes[i],b=bikes[j];if(drop.has(a.id)||drop.has(b.id))continue;if(t0(b)>t1(a))break;
    const ov=Math.min(t1(a),t1(b))-Math.max(t0(a),t0(b)),short=Math.min(t1(a)-t0(a),t1(b)-t0(b));if(short<=0||ov<.5*short)continue;
    const W=x=>x.icu_weighted_avg_watts||x.average_watts||0;
    let keep=a,other=b;
    if(isZwift(b)&&!isZwift(a))keep=b,other=a;else if(isZwift(a)===isZwift(b)&&W(b)>W(a))keep=b,other=a;
    if(!keep.average_heartrate&&other.average_heartrate){keep.average_heartrate=other.average_heartrate;keep.max_heartrate=other.max_heartrate}
    keep.hrFrom=other.id;keep.hrOffset=t0(keep)-t0(other);keep.dupName=other.name;drop.add(other.id);
  }
  return acts.filter(a=>!drop.has(a.id));
}
const EV=4;
function maybeRecompute(){if(DATA&&PLAN&&lsGet(LSK.raw,null)&&(!LIVE||LIVE.ev!==EV)){recompute();render()}}
function recompute(){
  const raw=lsGet(LSK.raw,null);if(!raw)return;
  const B=(DATA&&DATA.base)||null;
  const acts=dedupe((raw.acts||[]).filter(a=>a&&a.start_date_local).map(a=>Object.assign({},a,{date:a.start_date_local.slice(0,10),sp:sportOfA(a)}))).map(a=>Object.assign(a,{load:actLoad(a)}));
  const well={};(raw.well||[]).forEach(w=>{if(w&&w.id)well[w.id]=w});
  const today=dkey(new Date());
  // CTL/ATL quotidiens
  const actsN=B?acts.filter(a=>a.date>B.asof):acts;   // séances ajoutées au socle
  const first=new Date();first.setDate(first.getDate()-150);if(B){const f=new Date(B.asof+"T00:00:00");f.setDate(f.getDate()+1);first.setTime(f.getTime())}

  const w=PLAN.weeks.find(x=>x.n===+wn);const s=weekSessions(w).find(x=>x.uid===uid);if(!s)return;
  $("#sheet").innerHTML=`<div class="grab"></div><h3 style="font-family:var(--disp);font-weight:800;font-size:21px;margin:4px 0 2px">${D_IC[s.d]} ${esc(s.title)}</h3><div class="muted" style="font-size:13px">${DAYS[s.day]} ${fdate(s.date)} · ${SLOT_N[s.slot]}</div>
  <div class="dl" style="margin-top:16px">Déplacer</div><div class="row" style="margin-top:6px"><select id="mvD" class="sel">${DAYS.map((d,i)=>`<option value="${i}"${i===s.day?" selected":""}>${d}</option>`).join("")}</select><select id="mvS" class="sel">${SLOTS.map(x=>`<option value="${x}"${x===s.slot?" selected":""}>${SLOT_N[x]}</option>`).join("")}</select><button class="btn" style="background:var(--acc);color:#fff" data-act="smove" data-v="${wn}|${uid}">Déplacer</button></div>
  <button class="go" style="background:var(--card2);color:var(--pain);margin-top:16px" data-act="sdel" data-v="${wn}|${uid}">Supprimer cette séance</button>
  ${s.moved?`<button class="btn" style="width:100%;margin-top:10px" data-act="sreset" data-v="${wn}|${uid}">Remettre à sa place d'origine</button>`:""}`;
  $("#ov").classList.add("show");
}
function sheetAdd(wn,day){
  UI.addSport=UI.addSport||"velo";
  const l=LIB[UI.addSport];
  $("#sheet").innerHTML=`<div class="grab"></div><h3 style="font-family:var(--disp);font-weight:800;font-size:21px;margin:4px 0 10px">Ajouter une séance</h3>
  <div class="chips" style="margin-top:0">${Object.keys(LIB).map(k=>`<button class="chip${k===UI.addSport?" sel":""}" data-act="asport" data-v="${wn}|${day}|${k}">${D_IC[k]} ${D_N[k]}</button>`).join("")}</div>
  <div style="margin-top:12px">${l.map((x,i)=>`<label class="orow" style="cursor:pointer"><input type="radio" name="alib" value="${i}"${i===0?" checked":""}><span class="ol">${esc(x[2])}</span><span class="muted" style="font-size:12px">${hm(x[3])}</span></label>`).join("")}</div>
  <div class="row" style="margin-top:12px"><select id="adD" class="sel">${DAYS.map((d,i)=>`<option value="${i}"${i===+day?" selected":""}>${d}</option>`).join("")}</select><select id="adS" class="sel">${SLOTS.map(x=>`<option value="${x}"${x==="soir"?" selected":""}>${SLOT_N[x]}</option>`).join("")}</select></div>
  <button class="go" data-act="sadddo" data-v="${wn}">Ajouter</button>`;
  $("#ov").classList.add("show");
}
function vOrga(){
  if(!PLAN||!PLAN.blocks[0].tpl)return "";
  UI.ob=UI.ob||(PLAN.blocks.find(b=>b.from<=today()&&b.to>=today())||PLAN.blocks[0]).n;
  const b=PLAN.blocks.find(x=>x.n===UI.ob);const cnt={};b.tpl.forEach(t=>cnt[t.d]=(cnt[t.d]||0)+1);
  const rows=b.tpl.map(t=>{const p=place(b.n,t);return `<div class="orow"><span class="ic">${D_IC[t.d]}</span><span class="ol">${esc(t.l)}</span><select data-sched="${t.id}" data-f="day">${DAYS.map((d,i)=>`<option value="${i}"${p.day===i?" selected":""}>${d}</option>`).join("")}</select><select data-sched="${t.id}" data-f="slot">${SLOTS.map(s=>`<option value="${s}"${p.slot===s?" selected":""}>${SLOT_N[s]}</option>`).join("")}</select></div>`}).join("");
  return `<h2>Organisation de la semaine</h2><div class="card"><div class="chips" style="margin-top:0">${PLAN.blocks.map(x=>`<button class="chip${x.n===UI.ob?" sel":""}" data-act="ob" data-v="${x.n}">${x.n}</button>`).join("")}</div>
  <div class="dsplit" style="margin:12px 0 4px">${["velo","course","nat","muscu"].filter(k=>cnt[k]).map(k=>`<span>${D_IC[k]} ${cnt[k]} ${D_N[k].toLowerCase()}</span>`).join("")}<span>· par semaine</span></div>
  <div class="muted" style="font-size:12px;margin-bottom:6px">Place chaque séance où ça t'arrange : le programme suit.</div>${rows}
  <button class="btn" style="margin-top:12px" data-act="schedreset">Revenir à l'organisation conseillée</button></div>`;
}

/* ============ INTRO ============ */
function runIntro(){
  if(!S.prefs.intro)return;
  const runA={h:[63,15],n:[61,24],p:[57,51],e1:[67,35],w1:[76,30],e2:[52,37],w2:[47,47],k1:[71,62],f1:[69,81],k2:[50,68],f2:[39,82]};
  const runB={h:[63,15],n:[61,24],p:[57,51],e1:[52,37],w1:[47,47],e2:[67,35],w2:[76,30],k1:[50,68],f1:[39,82],k2:[71,62],f2:[69,81]};
  const stand={h:[61,15],n:[60,24],p:[60,52],e1:[63,38],w1:[65,50],e2:[57,38],w2:[55,50],k1:[62,70],f1:[63,88],k2:[58,70],f2:[57,88]};
  const ring=Object.assign({},stand,{h:[59,15],e1:[70,12],w1:[80,4]});
  const vic=Object.assign({},stand,{e1:[70,11],w1:[76,-2],e2:[50,11],w2:[44,-2],h:[60,14]});
  const el=document.createElement("div");el.className="intro";
  const GY=180,K=1.45;
  let fl="";for(let r=0;r<2;r++)for(let c=0;c<4;c++)fl+=`<rect x="${294+c*5}" y="${GY+r*5}" width="5" height="5" fill="${(r+c)%2?"#0D1014":"#EEF1F5"}"/>`;
  const BX=[4,46,88,130,206,366];let bar="";
  BX.forEach(x=>{bar+=`<line x1="${x+4}" y1="${GY-2}" x2="${x+4}" y2="${GY+10}" stroke="#3A414C" stroke-width="2"/><line x1="${x+32}" y1="${GY-2}" x2="${x+32}" y2="${GY+10}" stroke="#3A414C" stroke-width="2"/><rect x="${x}" y="${GY-22}" width="36" height="22" rx="2" fill="var(--acc)"/><text x="${x+18}" y="${GY-4.5}" text-anchor="middle" font-family="Arial Black,Helvetica Neue,system-ui" font-weight="900" font-size="17" fill="#0D1014">M</text>`});
  const PPL=[];for(let x=10;x<400;x+=15){if(x>232&&x<370&&!(x>356))continue;PPL.push({x:x+(Math.random()*6-3),h:GY-40-Math.random()*8,c:["#5A6372","#4A5260","#6B7483","#3E4550"][Math.floor(Math.random()*4)],ph:Math.random()*6,sp:6+Math.random()*5,up:Math.random()<.6})}
  el.innerHTML=`<button class="skip">Passer</button>
  <svg viewBox="0 0 400 230">
    <line x1="0" y1="${GY+10}" x2="400" y2="${GY+10}" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 6"/>
    <g id="crowd"></g>${bar}
    ${fl}
    <line x1="250" y1="${GY+10}" x2="250" y2="60" stroke="var(--txt)" stroke-width="5" stroke-linecap="round"/>
    <line x1="356" y1="${GY+10}" x2="356" y2="60" stroke="var(--txt)" stroke-width="5" stroke-linecap="round"/>
    <rect x="240" y="40" width="126" height="26" rx="6" fill="var(--acc)"/>
    <text x="303" y="63" text-anchor="middle" font-family="Arial Black,Helvetica Neue,system-ui" font-weight="900" font-size="25" fill="#0D1014">M</text>
    <line x1="196" y1="${GY+10}" x2="196" y2="70" stroke="var(--far)" stroke-width="4" stroke-linecap="round"/>
    <line x1="196" y1="72" x2="180" y2="72" stroke="var(--far)" stroke-width="4" stroke-linecap="round"/>
    <g id="bell"><line x1="180" y1="72" x2="180" y2="78" stroke="var(--far)" stroke-width="2"/><path d="M171 92Q171 78 180 78Q189 78 189 92L192 95H168Z" fill="#E9B949"/><circle cx="180" cy="97" r="2.5" fill="#E9B949"/></g>
    <g id="ding" opacity="0" stroke="#E9B949" stroke-width="2" stroke-linecap="round"><line x1="196" y1="80" x2="204" y2="76"/><line x1="197" y1="88" x2="206" y2="88"/><line x1="164" y1="80" x2="156" y2="76"/></g>
    <g id="man" class="fig"></g><g id="conf"></g>
  </svg>
  <div class="ttl">Iron<i>max</i></div>`;
  document.body.appendChild(el);
  const crowd=el.querySelector("#crowd"),man=el.querySelector("#man"),bell=el.querySelector("#bell"),ding=el.querySelector("#ding"),conf=el.querySelector("#conf"),ttl=el.querySelector(".ttl");
  const place=(X,q,bob)=>{man.setAttribute("transform",`translate(${(X-60*K).toFixed(1)},${(GY+10-88*K+(bob||0)).toFixed(1)}) scale(${K})`);man.innerHTML=figInner(q,[],1)};
  const runPose=t=>{const u=(t/.32)%2;const i=Math.floor(u);let f=u-i;return i===0?lerp(runA,runB,f):lerp(runB,runA,f)};
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  let parts=[],t0=null,done=false,dinged=false,boomed=false,raf;
  const cols=["#E4002B","#EEF1F5","#E4002B","#6EC8FF","#E9B949","#1A1A1A"];
  function boom(){for(let i=0;i<90;i++){const a=-Math.PI/2+(Math.random()-.5)*2.4,v=90+Math.random()*170;parts.push({x:303,y:70,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:Math.random()*360,vr:(Math.random()-.5)*720,c:cols[i%cols.length],w:3+Math.random()*4,h:2+Math.random()*3})}}
  function close(){if(done)return;done=true;cancelAnimationFrame(raf);el.classList.add("out");setTimeout(()=>el.remove(),550)}
  let last=null;
  function frame(ts){
    if(done)return;if(t0===null){t0=ts;last=ts}const t=(ts-t0)/1000,dt=Math.min(.05,(ts-last)/1000);last=ts;
    if(t<1.5){const X=-30+187*ease(Math.min(1,t/1.5));place(X,runPose(t),-Math.abs(Math.sin(t*Math.PI/.32))*3)}
    else if(t<2.5){const r=t<1.7?lerp(stand,ring,(t-1.5)/.2):t<2.3?ring:lerp(ring,stand,(t-2.3)/.2);place(157,r);
      if(t>1.7&&t<2.4){const sw=Math.sin((t-1.7)*30)*18*(1-(t-1.7)/.7);bell.setAttribute("transform",`rotate(${sw.toFixed(1)} 180 74)`);ding.setAttribute("opacity",(Math.abs(Math.sin((t-1.7)*15))).toFixed(2));if(!dinged){dinged=true;beep(1320,.5);setTimeout(()=>beep(1760,.4),120)}}
      else{bell.removeAttribute("transform");ding.setAttribute("opacity","0")}}
    else if(t<3.5){const u=(t-2.5)/1;const X=157+(330-157)*u;place(X,runPose(t),-Math.abs(Math.sin(t*Math.PI/.32))*3);if(X>303&&!boomed){boomed=true;boom()}}
    else{const u=Math.min(1,(t-3.5)/.3);place(330,lerp(stand,vic,u));ttl.classList.add("show")}
    crowd.innerHTML=PPL.map(p=>{const sh=p.h+9,a=Math.sin(t*p.sp+p.ph),b=Math.sin(t*p.sp+p.ph+1.2);const L=p.up?[[p.x-7-a*2,sh-11+a*3],[p.x+7+b*2,sh-11+b*3]]:[[p.x-8,sh+4+a*3],[p.x+8,sh-10-Math.abs(b)*4]];
      return `<g stroke="${p.c}" stroke-width="3" stroke-linecap="round"><line x1="${p.x}" y1="${sh}" x2="${p.x}" y2="${GY-6}"/><line x1="${p.x}" y1="${sh+1}" x2="${L[0][0].toFixed(1)}" y2="${L[0][1].toFixed(1)}"/><line x1="${p.x}" y1="${sh+1}" x2="${L[1][0].toFixed(1)}" y2="${L[1][1].toFixed(1)}"/></g><circle cx="${p.x}" cy="${p.h}" r="5" fill="${p.c}"/>`}).join("");
    if(parts.length){parts.forEach(p=>{p.vy+=260*dt;p.vx*=.99;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt});
      conf.innerHTML=parts.filter(p=>p.y<240).map(p=>`<rect x="${(p.x-p.w/2).toFixed(1)}" y="${(p.y-p.h/2).toFixed(1)}" width="${p.w.toFixed(1)}" height="${p.h.toFixed(1)}" fill="${p.c}" transform="rotate(${p.r.toFixed(0)} ${p.x.toFixed(1)} ${p.y.toFixed(1)})"/>`).join("")}
    if(t>5.6){close();return}
    raf=requestAnimationFrame(frame);
  }
  el.addEventListener("click",()=>{close()});
  raf=requestAnimationFrame(frame);
}
loadData();loadPlan();
render();
runIntro();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
